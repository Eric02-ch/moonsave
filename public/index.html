<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#193f35"><meta name="description" content="每月幾分鐘，看看真正留下多少。月存是你的每月儲蓄回報與財務回顧工具。">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./theme.css">
  <title>月存 MoonSave｜把日子，慢慢存好</title>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#overview"><span class="brand-mark">◔</span><span>月存<small>MOONSAVE</small></span></a>
    <p class="sidebar-label">你的每月財務日記</p>
    <nav aria-label="主要導覽">
      <a href="#overview" data-page="overview"><span>◷</span>總覽</a>
      <a href="#report" data-page="report"><span>＋</span>月回報</a>
      <a href="#settings" data-page="settings"><span>⚙</span>設定</a>
    </nav>
    <div class="sidebar-bottom">每一小步，都算數。<small>YOUR MONEY, YOUR PACE</small></div>
  </aside>
  <div class="shell">
    <header class="topbar"><span class="breadcrumb">MY MONEY, MY PACE</span><span class="local-badge">● 本機儲存</span></header>
    <main id="app" tabindex="-1"></main>
    <footer>月存 MoonSave <span>·</span> 把日子，慢慢存好。</footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="confirm-dialog"><form method="dialog"><h2 id="confirm-title">確認操作</h2><p id="confirm-message"></p><label class="field" id="dialog-field" hidden><span>帳戶名稱</span><input id="dialog-input" maxlength="30"></label><div class="actions"><button value="cancel" class="button secondary">取消</button><button value="confirm" class="button primary">確認</button></div></form></dialog>
  <script type="module" src="./main.js"></script>
</body>
</html>
